name: Deploy backend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.editorconfig'
      - '.prettierrc'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH agent with deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Write production .env
        env:
          ENV_BODY: |
            NODE_ENV=production
            PORT=3000
            LOG_LEVEL=info

            DB_HOST=postgres
            DB_PORT=5432
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_SSL=false

            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_ACCESS_EXPIRES_IN=900
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=604800
            JWT_SETUP_PROFILE_EXPIRES_IN=600
            JWT_RESET_PASSWORD_EXPIRES_IN=3600

            BCRYPT_SALT_ROUNDS=12
            CORS_ORIGINS=https://dashboard.basty.ly

            DOCS_USERNAME=${{ secrets.DOCS_USERNAME }}
            DOCS_PASSWORD=${{ secrets.DOCS_PASSWORD }}

            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAIL_REPLY_TO=${{ secrets.MAIL_REPLY_TO }}

            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}

            GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
            GOOGLE_CLOUD_KEY_FILE=${{ secrets.GOOGLE_CLOUD_KEY_FILE }}

            LARA_ACCESS_KEY_ID=${{ secrets.LARA_ACCESS_KEY_ID }}
            LARA_ACCESS_KEY_SECRET=${{ secrets.LARA_ACCESS_KEY_SECRET }}

            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}

            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=basti-backend@${{ github.sha }}
        run: |
          printf '%s' "$ENV_BODY" > backend.env
          # sanity check that no required value rendered empty
          if grep -E '^[A-Z_]+=$' backend.env; then
            echo "::error::One or more secrets are empty"
            grep -E '^[A-Z_]+=$' backend.env
            exit 1
          fi

      - name: Upload .env to server
        # Use cat-over-ssh instead of scp to avoid SFTP-protocol issues
        run: |
          ssh -o StrictHostKeyChecking=no \
            elmelegy@${{ secrets.SERVER_HOST }} \
            'cat > /home/elmelegy/basti/backend-basti-service/.env && chmod 600 /home/elmelegy/basti/backend-basti-service/.env' \
            < backend.env

      - name: Pull, build, migrate, restart
        run: |
          ssh -o StrictHostKeyChecking=no elmelegy@${{ secrets.SERVER_HOST }} 'bash -se' <<'EOF'
            set -euo pipefail
            cd ~/basti/backend-basti-service
            git fetch origin main
            git reset --hard origin/main
            cd infra
            # Use --env-file so docker compose substitutes ${VAR} references from .env

            # 1. Build the new backend image (postgres stays up).
            docker compose --env-file ../.env build backend

            # 2. Apply pending Drizzle migrations from the new image, one-shot.
            #    --no-deps skips restarting postgres. --entrypoint '' bypasses tini
            #    so we can call pnpm directly. If migrate fails, this step exits
            #    non-zero (set -e) and the new backend never starts — old
            #    container keeps serving until we investigate.
            docker compose --env-file ../.env run --rm --no-deps \
              --entrypoint '' backend pnpm db:migrate

            # 3. Only if migrate succeeded, swap in the new container.
            #    --force-recreate guarantees the running container is replaced
            #    even when compose's image-digest detection fails to notice
            #    the rebuild — the whole point of a deploy is to swap code,
            #    so we're never OK with "keep the existing container".
            docker compose --env-file ../.env up -d --build --force-recreate
            docker compose --env-file ../.env ps
            sudo systemctl reload caddy || true
          EOF

      - name: Verify health (with retry)
        run: |
          ssh -o StrictHostKeyChecking=no elmelegy@${{ secrets.SERVER_HOST }} 'bash -se' <<'EOF'
            set -euo pipefail
            # Backend takes ~20s to fully boot. Retry up to 60s.
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo ""
                echo "Health OK after ${i} attempt(s)."
                exit 0
              fi
              echo "Attempt $i: not ready yet, sleeping 5s..."
              sleep 5
            done
            echo "Health check failed after 60s. Recent logs:"
            docker logs basti-backend --tail 80
            exit 1
          EOF

      - name: Notify GlitchTip of new release
        if: success()
        env:
          GT_ORG: basti-backend
          PROJECT: basti-backend
          VERSION: basti-backend@${{ github.sha }}
          TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          # 1. Create / upsert the release with a commit ref
          curl -fsS -X POST "https://glitchtip.basty.ly/api/0/organizations/$GT_ORG/releases/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\":\"$VERSION\",
              \"projects\":[\"$PROJECT\"],
              \"refs\":[{\"repository\":\"${{ github.repository }}\",\"commit\":\"${{ github.sha }}\"}]
            }" || echo "::warning::release create returned non-2xx (may already exist)"

          # 2. Record a deploy under that release for the production environment
          curl -fsS -X POST "https://glitchtip.basty.ly/api/0/organizations/$GT_ORG/releases/$VERSION/deploys/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"environment\":\"production\",\"name\":\"GitHub Actions ${{ github.run_id }}\"}" \
            || echo "::warning::deploy create returned non-2xx"
