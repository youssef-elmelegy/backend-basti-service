name: Deploy backend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.editorconfig'
      - '.prettierrc'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # Fails the deploy if src/env.ts declares a schema key that isn't listed as
  # a required GitHub Secret below. This is the drift guard — every prior prod
  # outage in this repo came from a schema change without a matching secret /
  # workflow update, and this catches that at PR time instead of at request time.
  schema-secrets-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Diff schema keys against known non-secret keys
        run: |
          set -euo pipefail
          # Keys the app expects to come from process.env but that are NOT
          # backed by a GitHub Secret — either hardcoded prod values written
          # by the deploy step (NODE_ENV, PORT, DB_HOST, expiries, CORS_ORIGINS)
          # or values the schema defaults / marks optional.
          NON_SECRET_KEYS=$(sort -u <<'EOF'
          NODE_ENV
          PORT
          LOG_LEVEL
          DB_HOST
          DB_PORT
          DB_SSL
          JWT_ACCESS_EXPIRES_IN
          JWT_REFRESH_EXPIRES_IN
          JWT_SETUP_PROFILE_EXPIRES_IN
          JWT_RESET_PASSWORD_EXPIRES_IN
          BCRYPT_SALT_ROUNDS
          CORS_ORIGINS
          SENTRY_RELEASE
          EOF
          )

          SCHEMA_KEYS=$(grep -oE '^[[:space:]]+[A-Z][A-Z0-9_]*:[[:space:]]*z\b' src/env.ts \
            | sed -E 's/^[[:space:]]+([A-Z][A-Z0-9_]*).*/\1/' | sort -u)

          echo "== Schema keys =="; echo "$SCHEMA_KEYS"
          echo "== Non-secret keys =="; echo "$NON_SECRET_KEYS"

          # Keys expected to come from secrets = schema minus non-secret list
          EXPECTED_SECRETS=$(comm -23 <(echo "$SCHEMA_KEYS") <(echo "$NON_SECRET_KEYS"))
          echo "== Expected GitHub Secrets =="; echo "$EXPECTED_SECRETS"

          # We can't read the secrets list from here, so we defer per-key
          # emptiness checks to the deploy step. This step just prints the
          # list so PR reviewers see what a new schema key requires.

  deploy:
    needs: schema-secrets-drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure SSH agent with deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Write production .env
        # Two-part render: static prod values (not secrets) are prepended,
        # then render-env.mjs emits every KEY declared in src/env.ts whose
        # value is present in the exported process env.
        #
        # ALL_SECRETS is `toJSON(secrets)` — the full secret map for this
        # environment. We parse it in Node and re-export each entry so the
        # render script sees them via process.env. Any new schema key with a
        # same-named secret flows through automatically — no workflow edit
        # required. That is the whole point of this refactor: `secrets.X`
        # references stop being the source of drift.
        env:
          ENV_BODY: |
            NODE_ENV=production
            PORT=3000
            LOG_LEVEL=info

            DB_HOST=postgres
            DB_PORT=5432
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_SSL=false

            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_ACCESS_EXPIRES_IN=900
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=604800
            JWT_SETUP_PROFILE_EXPIRES_IN=600
            JWT_RESET_PASSWORD_EXPIRES_IN=3600

            BCRYPT_SALT_ROUNDS=12
            CORS_ORIGINS=https://dashboard.basty.ly

            DOCS_USERNAME=${{ secrets.DOCS_USERNAME }}
            DOCS_PASSWORD=${{ secrets.DOCS_PASSWORD }}

            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAIL_REPLY_TO=${{ secrets.MAIL_REPLY_TO }}

            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}

            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_CLIENT_EMAIL=${{ secrets.GCP_CLIENT_EMAIL }}
            GCP_PRIVATE_KEY=${{ secrets.GCP_PRIVATE_KEY }}

            LARA_ACCESS_KEY_ID=${{ secrets.LARA_ACCESS_KEY_ID }}
            LARA_ACCESS_KEY_SECRET=${{ secrets.LARA_ACCESS_KEY_SECRET }}

            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}

            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=basti-backend@${{ github.sha }}

            MASARAT_URL=${{ secrets.MASARAT_URL }}
            MASARAT_USER_ID=${{ secrets.MASARAT_USER_ID }}
            MASARAT_PIN=${{ secrets.MASARAT_PIN }}
            MASARAT_PROVIDER_ID=${{ secrets.MASARAT_PROVIDER_ID }}

            TADAWUL_URL=${{ secrets.TADAWUL_URL }}
            TADAWUL_ID=${{ secrets.TADAWUL_ID }}
            TADAWUL_TOKEN=${{ secrets.TADAWUL_TOKEN }}
            TADAWUL_WEBHOOK_URL=${{ secrets.TADAWUL_WEBHOOK_URL }}

        run: |
          set -euo pipefail

          # 1. Static / non-secret prod values
          cat > backend.env <<'STATIC_EOF'
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info

          DB_HOST=postgres
          DB_PORT=5432
          DB_SSL=false

          JWT_ACCESS_EXPIRES_IN=900
          JWT_REFRESH_EXPIRES_IN=604800
          JWT_SETUP_PROFILE_EXPIRES_IN=600
          JWT_RESET_PASSWORD_EXPIRES_IN=3600

          BCRYPT_SALT_ROUNDS=12
          CORS_ORIGINS=https://dashboard.basty.ly
          STATIC_EOF

          # Sentry release tracks the deployed commit
          echo "SENTRY_RELEASE=basti-backend@${{ github.sha }}" >> backend.env
          echo "" >> backend.env

          # 2. Secret-backed values, one line per schema key that has a value.
          #    We rehydrate secrets into env vars first so render-env.mjs (which
          #    reads process.env) picks them up.
          node -e '
            const secrets = JSON.parse(process.env.ALL_SECRETS);
            for (const [k, v] of Object.entries(secrets)) {
              // Trailing NUL after every record so `read -d ""` in bash
              // sees every entry — without it the final record is dropped.
              process.stdout.write(k + "=" + v + "\0");
            }
          ' > /tmp/secrets.nul

          # Load each KEY=VALUE from the NUL-delimited stream into this shell
          # (env -0 style — safe for values with newlines/special chars),
          # then invoke the renderer with those env vars visible to it.
          set -a
          while IFS= read -r -d '' kv; do
            key="${kv%%=*}"
            val="${kv#*=}"
            export "$key=$val"
          done < /tmp/secrets.nul
          set +a
          rm -f /tmp/secrets.nul

          node scripts/render-env.mjs >> backend.env

          # 3. Sanity: every line must be KEY=VALUE with a non-empty value.
          #    render-env.mjs already skips empty ones so this catches
          #    only mistakes in the static block above.
          if grep -E '^[A-Z][A-Z0-9_]*=$' backend.env; then
            echo "::error::One or more static env values are empty"
            grep -E '^[A-Z][A-Z0-9_]*=$' backend.env
            exit 1
          fi

          # 4. Fail loudly if a schema key required by the app has no secret.
          #    Non-secret keys (from the drift-check job) are exempted.
          SCHEMA_KEYS=$(grep -oE '^[[:space:]]+[A-Z][A-Z0-9_]*:[[:space:]]*z\b' src/env.ts \
            | sed -E 's/^[[:space:]]+([A-Z][A-Z0-9_]*).*/\1/' | sort -u)
          NON_SECRET_KEYS=$(printf '%s\n' \
            NODE_ENV PORT LOG_LEVEL DB_HOST DB_PORT DB_SSL \
            JWT_ACCESS_EXPIRES_IN JWT_REFRESH_EXPIRES_IN \
            JWT_SETUP_PROFILE_EXPIRES_IN JWT_RESET_PASSWORD_EXPIRES_IN \
            BCRYPT_SALT_ROUNDS CORS_ORIGINS SENTRY_RELEASE | sort -u)

          # Optional keys per schema — allowed to be missing.
          OPTIONAL_KEYS=$(printf '%s\n' \
            DOCS_USERNAME DOCS_PASSWORD MAIL_REPLY_TO SENTRY_DSN | sort -u)

          EXPECTED=$(comm -23 \
            <(echo "$SCHEMA_KEYS") \
            <(cat <(echo "$NON_SECRET_KEYS") <(echo "$OPTIONAL_KEYS") | sort -u))

          PRESENT=$(grep -oE '^[A-Z][A-Z0-9_]*=' backend.env | tr -d '=' | sort -u)

          MISSING=$(comm -23 <(echo "$EXPECTED") <(echo "$PRESENT") || true)
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secrets required by src/env.ts:"
            echo "$MISSING" | sed 's/^/  - /'
            echo ""
            echo "Add each of the above at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          echo "backend.env written with $(wc -l < backend.env) lines."

      - name: Upload .env to server
        # Use cat-over-ssh instead of scp to avoid SFTP-protocol issues
        run: |
          ssh -o StrictHostKeyChecking=no \
            elmelegy@${{ secrets.SERVER_HOST }} \
            'cat > /home/elmelegy/basti/backend-basti-service/.env && chmod 600 /home/elmelegy/basti/backend-basti-service/.env' \
            < backend.env

      - name: Pull, build, migrate, restart
        run: |
          ssh -o StrictHostKeyChecking=no elmelegy@${{ secrets.SERVER_HOST }} 'bash -se' <<'EOF'
            set -euo pipefail
            cd ~/basti/backend-basti-service
            git fetch origin main
            git reset --hard origin/main
            cd infra
            # Use --env-file so docker compose substitutes ${VAR} references from .env

            # 1. Build the new backend image (postgres stays up).
            docker compose --env-file ../.env build backend

            # 2. Apply pending Drizzle migrations from the new image, one-shot.
            #    --no-deps skips restarting postgres. --entrypoint '' bypasses tini
            #    so we can call pnpm directly. If migrate fails, this step exits
            #    non-zero (set -e) and the new backend never starts — old
            #    container keeps serving until we investigate.
            #
            #    -T disables the pseudo-TTY and </dev/null detaches stdin —
            #    without these, `compose run` inherits the SSH heredoc's stdin
            #    and slurps every remaining line of this script (up, ps,
            #    caddy reload) as input for pnpm, silently skipping them.
            #    That was the "container never gets recreated" bug.
            docker compose --env-file ../.env run --rm --no-deps -T \
              --entrypoint '' backend pnpm db:migrate </dev/null

            # 3. Only if migrate succeeded, swap in the new container.
            #    --force-recreate guarantees the running container is replaced
            #    even when compose's image-digest detection fails to notice
            #    the rebuild — the whole point of a deploy is to swap code,
            #    so we're never OK with "keep the existing container".
            docker compose --env-file ../.env up -d --build --force-recreate
            docker compose --env-file ../.env ps
            sudo systemctl reload caddy || true
          EOF

      - name: Verify health (with retry)
        run: |
          ssh -o StrictHostKeyChecking=no elmelegy@${{ secrets.SERVER_HOST }} 'bash -se' <<'EOF'
            set -euo pipefail
            # Backend takes ~20s to fully boot. Retry up to 60s.
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo ""
                echo "Health OK after ${i} attempt(s)."
                exit 0
              fi
              echo "Attempt $i: not ready yet, sleeping 5s..."
              sleep 5
            done
            echo "Health check failed after 60s. Recent logs:"
            docker logs basti-backend --tail 80
            exit 1
          EOF

      - name: Notify GlitchTip of new release
        if: success()
        env:
          GT_ORG: basti-backend
          PROJECT: basti-backend
          VERSION: basti-backend@${{ github.sha }}
          TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          # 1. Create / upsert the release with a commit ref
          curl -fsS -X POST "https://glitchtip.basty.ly/api/0/organizations/$GT_ORG/releases/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\":\"$VERSION\",
              \"projects\":[\"$PROJECT\"],
              \"refs\":[{\"repository\":\"${{ github.repository }}\",\"commit\":\"${{ github.sha }}\"}]
            }" || echo "::warning::release create returned non-2xx (may already exist)"

          # 2. Record a deploy under that release for the production environment
          curl -fsS -X POST "https://glitchtip.basty.ly/api/0/organizations/$GT_ORG/releases/$VERSION/deploys/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"environment\":\"production\",\"name\":\"GitHub Actions ${{ github.run_id }}\"}" \
            || echo "::warning::deploy create returned non-2xx"
